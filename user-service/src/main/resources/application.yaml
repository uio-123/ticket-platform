server:
  port: 8084
spring:
  application:
    name: user-service # 微服务名称
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://${ticket.db.host}:3306/ticket_user?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${ticket.db.pw}
  cloud:
    nacos:
      server-addr: 192.168.150.101:8848
mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto
logging:
  level:
    com.ticketing: debug
  pattern:
    dateformat: HH:mm:ss:SSS
  file:
    path: "logs/${spring.application.name}"
knife4j:
  enable: true
  openapi:
    title: 票务平台用户服务接口文档
    description: "票务平台用户服务接口文档"
    email: team@ticketing.local
    concat: Ticketing Team
    url: https://ticketing.local
    version: v1.0.0
    group:
      default:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.ticketing.user.controller
ticket:
  jwt:
    location: classpath:ticket-platform.jks
    alias: ticket-platform
    password: ticket-platform123
    tokenTTL: 30m