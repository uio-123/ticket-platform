server:
  port: 8080
spring:
  application:
    name: legacy-commerce-service
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://${ticket.db.host}:3306/ticket-platform?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${ticket.db.pw}
mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto
logging:
  level:
    com.ticketing: debug
  pattern:
    dateformat: HH:mm:ss:SSS
  file:
    path: "logs/${spring.application.name}"
knife4j:
  enable: true
  openapi:
    title: 票务平台接口文档
    description: "票务平台接口文档"
    email: team@ticketing.local
    concat: Ticketing Team
    url: https://ticketing.local
    version: v1.0.0
    group:
      default:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.ticketing.controller
ticket:
  jwt:
    location: classpath:ticket-platform.jks
    alias: ticket-platform
    password: ticket-platform123
    tokenTTL: 30m
  auth:
    excludePaths:
      - /search/**
      - /users/login
      - /items/**
      - /hi
# keytool -genkeypair -alias ticket-platform -keyalg RSA -keypass ticket-platform123 -keystore ticket-platform.jks -storepass ticket-platform123